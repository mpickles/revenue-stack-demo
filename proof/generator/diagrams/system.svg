<svg class="dia" viewBox="0 0 756 542" role="img" aria-labelledby="system-t system-d" xmlns="http://www.w3.org/2000/svg">
<title id="system-t">How the six builds connect</title>
<desc id="system-d">A visitor clicks an ad and lands on the tracked site. The campaign QA agent checks the site before launch. A form submit goes through the lead API to HubSpot and Salesforce. In Salesforce a Flow sets the stage, campaign and owner. The lead qualifier scores the lead and proposes an owner. The CRM cleanup merges duplicates. Qualified leads go back to Google Ads as a conversion upload file. Salesforce data feeds the SQL funnel, and a reporting agent writes a summary whose numbers are checked by code.</desc>
