<svg class="dia" viewBox="0 0 756 542" role="img" aria-labelledby="salesforce-routing-t salesforce-routing-d" xmlns="http://www.w3.org/2000/svg">
<title id="salesforce-routing-t">How a lead is routed in Salesforce</title>
<desc id="salesforce-routing-d">The Roadwren form sends a lead to Salesforce. Two validation rules block a lead with no consent or a free email at a company of 200 or more. A Flow sets the lifecycle stage, adds the lead to a campaign and assigns a queue. Leads with no employee count go to a Needs Review queue. When a lead converts, the click ID carries to the opportunity, and a script writes and checks the conversion upload file for Google Ads.</desc>
<defs><marker id="salesforce-routing-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="dia-head"/></marker></defs>
<path d="M214 47 L278 47" class="dia-line" marker-end="url(#salesforce-routing-a)"/>
<path d="M478 47 L542 47" class="dia-line" marker-end="url(#salesforce-routing-a)"/>
<text x="510" y="40" class="dia-label" text-anchor="middle">fails</text>
<path d="M378 80 L378 126" class="dia-line" marker-end="url(#salesforce-routing-a)"/>
<text x="386" y="103" class="dia-label" text-anchor="start">passes</text>
<path d="M378 192 L378 238" class="dia-line" marker-end="url(#salesforce-routing-a)"/>
<path d="M378 304 L378 350" class="dia-line" marker-end="url(#salesforce-routing-a)"/>
<path d="M478 383 L542 383" class="dia-line" marker-end="url(#salesforce-routing-a)"/>
<path d="M378 416 L378 462" class="dia-line" marker-end="url(#salesforce-routing-a)"/>
<path d="M478 495 L542 495" class="dia-line" marker-end="url(#salesforce-routing-a)"/>
<rect x="14" y="14" width="200" height="66" rx="6" class="dia-box "/>
<text x="114.0" y="44" class="dia-text" text-anchor="middle">Roadwren form</text>
<text x="114.0" y="61" class="dia-sub" text-anchor="middle">UTMs, click ID, consent</text>
<rect x="278" y="14" width="200" height="66" rx="6" class="dia-box "/>
<text x="378.0" y="51.5" class="dia-text" text-anchor="middle">Two validation rules</text>
<rect x="542" y="14" width="200" height="66" rx="6" class="dia-box m"/>
<text x="642.0" y="44" class="dia-text" text-anchor="middle">Blocked</text>
<text x="642.0" y="61" class="dia-sub" text-anchor="middle">no consent, or free email at 200+</text>
<rect x="278" y="126" width="200" height="66" rx="6" class="dia-box b"/>
<text x="378.0" y="156" class="dia-text" text-anchor="middle">Flow: lifecycle stage</text>
<text x="378.0" y="173" class="dia-sub" text-anchor="middle">MQL or New</text>
<rect x="278" y="238" width="200" height="66" rx="6" class="dia-box b"/>
<text x="378.0" y="268" class="dia-text" text-anchor="middle">Flow: campaign</text>
<text x="378.0" y="285" class="dia-sub" text-anchor="middle">from UTM medium</text>
<rect x="278" y="350" width="200" height="66" rx="6" class="dia-box b"/>
<text x="378.0" y="380" class="dia-text" text-anchor="middle">Flow: owner queue</text>
<text x="378.0" y="397" class="dia-sub" text-anchor="middle">by company size</text>
<rect x="542" y="350" width="200" height="66" rx="6" class="dia-box "/>
<text x="642.0" y="380" class="dia-text" text-anchor="middle">Needs Review Queue</text>
<text x="642.0" y="397" class="dia-sub" text-anchor="middle">size unknown</text>
<rect x="278" y="462" width="200" height="66" rx="6" class="dia-box "/>
<text x="378.0" y="492" class="dia-text" text-anchor="middle">Lead converts</text>
<text x="378.0" y="509" class="dia-sub" text-anchor="middle">click ID kept on the opportunity</text>
<rect x="542" y="462" width="200" height="66" rx="6" class="dia-box b"/>
<text x="642.0" y="492" class="dia-text" text-anchor="middle">Upload file for Google Ads</text>
<text x="642.0" y="509" class="dia-sub" text-anchor="middle">every row checked</text>
</svg>
