  <script>
    // Runs before the page paints. Applies the saved light or dark choice, and picks one accent
    // colour per visit: teal, cobalt, red, orange or plum. Each pair is [light mode, dark mode].
    (function () {
      var el = document.documentElement, pairs = [["#0F7B6C", "#3CC8B4"], ["#2348E8", "#7C93FF"], ["#C4261D", "#FF6B5E"], ["#C2500C", "#FF8A3D"], ["#8A2A6B", "#E58FCA"]];
      var pick = Math.floor(Math.random() * pairs.length);
      try {
        var theme = localStorage.getItem("theme"); if (theme) el.dataset.theme = theme;
        var saved = sessionStorage.getItem("accent");
        if (saved !== null && pairs[saved]) pick = Number(saved); else sessionStorage.setItem("accent", pick);
      } catch (e) {}
      el.style.setProperty("--a-l", pairs[pick][0]); el.style.setProperty("--a-d", pairs[pick][1]);
    })();
  </script>
