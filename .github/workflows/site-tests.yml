# Runs the site's typecheck and unit tests on every pull request that touches site/.
name: site tests

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-tests.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
