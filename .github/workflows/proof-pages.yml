# Rebuilds the proof pages in memory and fails if a committed page is out of date
# with its README, its tile text or its diagram.
name: proof pages

on:
  pull_request:
    paths:
      - "proof/**"
      - "**/README.md"
      - ".github/workflows/proof-pages.yml"
  push:
    branches: [main]
    paths:
      - "proof/**"
      - "**/README.md"
      - ".github/workflows/proof-pages.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r proof/generator/requirements.txt
      - run: python -m unittest discover -s proof/generator -p "test_*.py"
